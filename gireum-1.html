<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>기름앵GGO - Google Play 바로가기</title>
  <meta name="description" content="가까운 주유소, 가격 보고 바로 GO! 기름앵GGO">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px; font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
      background:linear-gradient(160deg,#0e2d48,#153d5c); color:#102b42;
    }
    .card{
      width:min(440px,100%); background:#fff; border-radius:28px; padding:34px 24px;
      text-align:center; box-shadow:0 18px 50px rgba(0,0,0,.25);
    }
    .icon{
      width:88px;height:88px;margin:0 auto 18px;border-radius:24px;
      background:#102f4b;display:flex;align-items:center;justify-content:center;
      font-size:48px;box-shadow:0 8px 22px rgba(0,0,0,.16);
    }
    h1{margin:0;font-size:36px;letter-spacing:-1.5px}
    h1 b{color:#f5b900}
    p{margin:12px 0 28px;color:#607080;font-size:17px;font-weight:650}
    a{
      display:block;text-decoration:none;background:#102f4b;color:white;
      padding:17px 20px;border-radius:16px;font-size:18px;font-weight:800;
      box-shadow:0 8px 18px rgba(16,47,75,.2)
    }
    a:active{transform:scale(.98)}
    .sub{margin-top:16px;font-size:13px;color:#98a3ad}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">⛽</div>
    <h1>기름앵<b>GGO</b></h1>
    <p>가까운 주유소, 가격 보고 바로 GO!</p>
    <a id="play" href="#" rel="noopener">Google Play에서 다운로드</a>
    <div class="sub">버튼을 누르면 Google Play로 이동합니다.</div>
  </main>

  <script>
    /* 아래 주소만 기름앵GGO의 실제 Google Play 주소로 교체하세요. */
    const PLAY_URL = "https://play.google.com/store/apps/details?id=com.yongsik.gireumangggo";
    document.getElementById("play").addEventListener("click", function(e){
      if (!PLAY_URL.startsWith("https://play.google.com/")) {
        e.preventDefault();
        alert("Google Play 주소가 아직 입력되지 않았습니다.");
        return;
      }
      this.href = PLAY_URL;
    });
  </script>
</body>
</html>
